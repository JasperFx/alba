name: Manual_Nuget_Push

on: [workflow_dispatch]

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10'
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Get NuGet OIDC token
        id: nuget-auth
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken('nuget.org');
            core.setSecret(token);
            return token;
          result-encoding: string

      - name: 'Run: NugetPush'
        run: ./build.cmd NugetPush
        env:
          NugetApiKey: ${{ steps.nuget-auth.outputs.result }}
